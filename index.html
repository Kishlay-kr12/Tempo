<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <meta charset="UTF-8">
  <title>Timer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: #f5f5f5;
      padding: 20px;
      transition: background 0.2s, color 0.2s;
    }

    body.dark {
      background: #121212;
      color: #f5f5f5;
    }

    body.flash-light {
      animation: flashBg 0.7s infinite alternate;
    }

    body.flash-dark {
      animation: flashBgDark 0.7s infinite alternate;
    }

    @keyframes flashBg {
      0% {
        background: #ffff00;
        color: #000000;
      }

      50% {
        background: #000000;
        color: #ffff00;
      }

      100% {
        background: #ffff00;
        color: #000000;
      }
    }

    @keyframes flashBgDark {
      0% {
        background: #ffff00;
        color: #222222;
      }

      50% {
        background: #222222;
        color: #ffff00;
      }

      100% {
        background: #ffff00;
        color: #222222;
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    button {
      padding: 10px;
      font-size: 1em;
      border-radius: 8px;
    }

    button {
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #timers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .timer {
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.1);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time {
      font-size: 2em;
      margin-bottom: 12px;
    }

    .target input,
    .flash-option input {
      width: 100px;
      text-align: center;
      margin-left: 5px;
    }

    .timer-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .timer-buttons button {
      flex: 1 1 40%;
    }

    .delete-btn {
      background: #dc3545;
    }

    .flash-option {
      margin-bottom: 8px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>

<body>
  <h1>Timer Dashboard</h1>

  <div class="controls">
    <input type="text" id="newLabel" placeholder="New timer name">
    <button onclick="addTimer()">Add</button>
    <button onclick="toggleDark()">Dark M.</button>
    <button onclick="toggleFullscreen()">Full Screen</button>
    <button id="wakeLockToggle" onclick="toggleManualWakeLock()">Keep Screen On</button>
    <button onclick="exportTimers()">Export</button>
  </div>

  <div id="timers"></div>

  <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

  <script>
    let timers = {};
    const timersDiv = document.getElementById("timers");
    let currentFlashing = false;
    const alarm = document.getElementById("alarmSound");

    // --- Wake Lock API ---
    let wakeLock = null;
    let manualWakeLock = false;

    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => console.log("Wake lock released"));
        document.addEventListener("visibilitychange", async () => {
          if (wakeLock !== null && document.visibilityState === "visible") {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        });
      } catch (err) {
        console.error("WakeLock error:", err.name, err.message);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    async function toggleManualWakeLock() {
      manualWakeLock = !manualWakeLock;
      const btn = document.getElementById("wakeLockToggle");
      btn.textContent = manualWakeLock ? "Screen Lock: ON" : "Keep Screen On";

      if (manualWakeLock) {
        await requestWakeLock();
      } else {
        if (!Object.values(timers).some(t => t.running)) releaseWakeLock();
      }
    }

    // --- Timer logic ---
    function format(ms, mask = false) {
      const sec = Math.floor(ms / 1000);
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");

      if (mask) return `XX:XX:${s}`;
      return `${h}:${m}:${s}`;
    }

    function saveTimers() { localStorage.setItem("timers", JSON.stringify(timers)); }

    function restoreTimers() {
      const saved = localStorage.getItem("timers");
      if (!saved) { ["Gaming", "Study", "Workout", "Break"].forEach(addTimer); return; }
      timers = JSON.parse(saved);
      Object.keys(timers).forEach(renderTimer);
    }

    function addTimer(label) {
      if (!label) {
        label = document.getElementById("newLabel").value.trim();
        if (!label) return;
        document.getElementById("newLabel").value = "";
      }
      if (timers[label]) return;
      timers[label] = {
        running: false,
        elapsed: 0,
        lastStart: 0,
        target: 0,
        flashOnTarget: true,
        maskTime: false, // new property
      };
      renderTimer(label);
      saveTimers();
    }

    function renderTimer(label) {
      if (document.getElementById(`timer-${label}`)) return;
      const div = document.createElement("div");
      div.className = "timer";
      div.id = `timer-${label}`;
      div.innerHTML = `
      <div class="label">
        <span id="${label}-label-text">${label}</span>
        <button onclick="editLabel('${label}')">✏️</button>
      </div>
      <div class="time" id="${label}-time">00:00:00</div>
      <div class="target">
        Target (min): 
        <input type="number" id="${label}-target" min="0" value="${timers[label].target / 60000 || 0}">
        <button id="${label}-plus10">+10 min</button>
      </div>
      <div class="flash-option">
        <label><input type="checkbox" id="${label}-flash" ${timers[label].flashOnTarget ? "checked" : ""}> Flash on target</label>
      </div>
      <div class="flash-option">
        <label><input type="checkbox" id="${label}-mask" ${timers[label].maskTime ? "checked" : ""}> Mask time</label>
      </div>
      <div class="timer-buttons">
        <button id="${label}-start">Start</button>
        <button id="${label}-stop">Stop</button>
        <button id="${label}-reset">Reset</button>
        <button id="${label}-delete" class="delete-btn">Delete</button>
      </div>`;
      timersDiv.appendChild(div);

      document.getElementById(`${label}-start`).onclick = () => startTimer(label);
      document.getElementById(`${label}-stop`).onclick = () => stopTimer(label);
      document.getElementById(`${label}-reset`).onclick = () => resetTimer(label);
      document.getElementById(`${label}-delete`).onclick = () => deleteTimer(label);
      document.getElementById(`${label}-target`).oninput = e => { timers[label].target = Number(e.target.value) * 60000; saveTimers(); };
      document.getElementById(`${label}-flash`).onchange = e => { timers[label].flashOnTarget = e.target.checked; saveTimers(); };
      document.getElementById(`${label}-mask`).onchange = e => { timers[label].maskTime = e.target.checked; saveTimers(); };
      document.getElementById(`${label}-plus10`).onclick = () => {
        timers[label].target += 10 * 60000;
        document.getElementById(`${label}-target`).value = timers[label].target / 60000;
        saveTimers();
      };
    }

    function editLabel(oldLabel) {
      const newLabel = prompt("Enter new label name:", oldLabel);
      if (!newLabel || newLabel === oldLabel) return;
      if (timers[newLabel]) {
        alert("That label already exists!");
        return;
      }
      timers[newLabel] = { ...timers[oldLabel] };
      delete timers[oldLabel];
      document.getElementById(`timer-${oldLabel}`).remove();
      renderTimer(newLabel);
      saveTimers();
    }

    function startTimer(label) {
      Object.keys(timers).forEach(l => stopTimer(l));
      timers[label].running = true;
      timers[label].lastStart = Date.now();
      requestWakeLock();
      saveTimers();
    }

    function stopTimer(label) {
      if (!timers[label].running) return;
      timers[label].elapsed += Date.now() - timers[label].lastStart;
      timers[label].running = false;

      if (!manualWakeLock && !Object.values(timers).some(t => t.running)) {
        releaseWakeLock();
      }
      saveTimers();
    }

    function resetTimer(label) {
      timers[label].elapsed = 0;
      timers[label].running = false;
      updateDisplay(label);

      if (!manualWakeLock && !Object.values(timers).some(t => t.running)) {
        releaseWakeLock();
      }
      saveTimers();
    }

    function deleteTimer(label) {
      stopTimer(label);
      delete timers[label];
      document.getElementById(`timer-${label}`).remove();

      if (!manualWakeLock && !Object.values(timers).some(t => t.running)) {
        releaseWakeLock();
      }
      saveTimers();
    }

    function updateDisplay(label) {
      if (!timers[label]) return;
      let elapsed = timers[label].elapsed;
      if (timers[label].running) elapsed += Date.now() - timers[label].lastStart;
      document.getElementById(`${label}-time`).textContent = format(elapsed, timers[label].maskTime);
    }

    function checkFlashing() {
      const anyTriggered = Object.values(timers).some(
        t => t.running && t.target > 0 && (t.elapsed + (t.running ? Date.now() - t.lastStart : 0)) >= t.target && t.flashOnTarget
      );

      if (anyTriggered) {
        startFlashing();
        playAlarm();
      } else {
        stopFlashing();
      }
    }

    function startFlashing() {
      if (currentFlashing) return;
      currentFlashing = true;
      const flashClass = document.body.classList.contains("dark") ? "flash-dark" : "flash-light";
      document.body.classList.add(flashClass);
    }

    function stopFlashing() {
      if (!currentFlashing) return;
      currentFlashing = false;
      document.body.classList.remove("flash-light", "flash-dark");
      alarm.pause();
      alarm.currentTime = 0;
    }

    function playAlarm() {
      if (alarm.paused) {
        alarm.currentTime = 0;
        alarm.play();
      }
    }

    function toggleDark() { document.body.classList.toggle("dark"); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function exportTimers() {
      if (!Object.keys(timers).length) {
        alert("No timers to export.");
        return;
      }

      if (!confirm("Do you really want to export the timers?")) return; // Confirmation added

      const today = new Date().toISOString().slice(0, 10);
      let newRows = "";
      for (let label in timers) {
        const t = timers[label];
        newRows += `${today},${label},${format(t.elapsed)},${format(t.target)},${t.flashOnTarget}\n`;
        resetTimer(label); // reset after export
      }

      let csv = localStorage.getItem("exportCSV");
      if (!csv) {
        csv = "Date,Label,Elapsed (HH:MM:SS),Target (HH:MM:SS),FlashOnTarget\n";
      }
      csv += newRows;
      localStorage.setItem("exportCSV", csv);

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "timers_log.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      saveTimers(); // keep the timers structure, just reset
    }



    setInterval(() => {
      Object.keys(timers).forEach(updateDisplay);
      checkFlashing();
    }, 500);

    restoreTimers();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("SW registered"))
        .catch(err => console.error("SW failed", err));
    }
  </script>
</body>

</html>
